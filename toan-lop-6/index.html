<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toán 6 – Tự học từng bước</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap">
<style>
:root{--bg:#fbfaf4;--grid:#dfe8ee;--ink:#17324d;--mut:#5a6b7b;--card:#fff;--acc:#0f766e;--accbg:#d9f2ee;--hl:#ffe27a;--ok:#177a3c;--okbg:#dff5e5;--bad:#b4234a;--badbg:#fde4ea;--line:#c9d6de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101b27;--grid:#1a2a3a;--ink:#e8f0f7;--mut:#9fb2c3;--card:#172636;--acc:#4fd1c0;--accbg:#12383a;--hl:#6b5a14;--ok:#6fdc8e;--okbg:#143822;--bad:#ff8fae;--badbg:#431a28;--line:#2c4257}}
:root[data-theme="dark"]{--bg:#101b27;--grid:#1a2a3a;--ink:#e8f0f7;--mut:#9fb2c3;--card:#172636;--acc:#4fd1c0;--accbg:#12383a;--hl:#6b5a14;--ok:#6fdc8e;--okbg:#143822;--bad:#ff8fae;--badbg:#431a28;--line:#2c4257}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Be Vietnam Pro",system-ui,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-size:17px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;min-height:100%}
main{max-width:780px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0 14px}
h1{font-size:1.5rem;margin:0;font-weight:800}h2{font-size:1.25rem;margin:.2em 0 .5em}h3{font-size:1.05rem;margin:1em 0 .3em}
.mark{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.btn{font:inherit;font-weight:600;min-height:46px;padding:8px 18px;border-radius:10px;border:2px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
:root:not([data-theme="light"]) .btn{color:#06201e}
.btn.ghost{background:transparent;color:var(--acc)}.btn:focus-visible,input:focus-visible,.lesson:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lesson{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:14px;margin:8px 0;cursor:pointer}
.lesson:hover{border-color:var(--acc)}.tag{font-size:.85rem;color:var(--mut)}
.bar{height:12px;border-radius:8px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.steps{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap}.steps span{font-size:.85rem;padding:2px 10px;border-radius:20px;border:1.5px solid var(--line);color:var(--mut)}.steps .on{background:var(--accbg);border-color:var(--acc);color:var(--ink);font-weight:600}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.15}.fr i{font-style:normal;border-bottom:2px solid currentColor;padding:0 4px}.fr b{font-weight:400;padding:0 4px}
input.ans{font:inherit;font-size:1.2rem;width:150px;min-height:48px;padding:6px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.fb{border-radius:10px;padding:12px 14px;margin:12px 0}.fb.ok{background:var(--okbg);border:2px solid var(--ok)}.fb.no{background:var(--badbg);border:2px solid var(--bad)}.fb.info{background:var(--accbg);border:2px solid var(--acc)}
.ex{border-left:5px solid var(--acc);padding-left:12px;margin:10px 0}.warn{background:var(--badbg);border-radius:10px;padding:8px 12px;margin:10px 0}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:8px 4px;text-align:left}.wrap{overflow-x:auto}
svg{max-width:100%;height:auto}
@media (prefers-reduced-motion:no-preference){.fb{animation:pop .2s ease-out}@keyframes pop{from{transform:scale(.97);opacity:.4}}}
</style>

<body>
<main id="app"></main>
<script>
"use strict";
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const norm=(n,d)=>{const g=gcd(n,d)||1;if(d<0){n=-n;d=-d}return{n:n/g,d:d/g}};
const eq=(x,y)=>x.n*y.d===y.n*x.d;
const F=(n,d=1)=>{const neg=(n<0)!==(d<0)&&n!==0,a=Math.abs(n),b=Math.abs(d);const s=neg?"−":"";return b===1?s+a:s+'<span class="fr"><i>'+a+'</i><b>'+b+'</b></span>'};
const Fo=o=>F(o.n,o.d);
const Z=n=>n<0?"−"+(-n):""+n;
/* ---------- lưu tiến độ (chỉ trên thiết bị này) ---------- */
let mem={lessons:{}};
const KEY="toan6_mvp_v1";
function load(){try{const s=localStorage.getItem(KEY);if(s)mem=JSON.parse(s)}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(mem))}catch(e){}}
const prog=id=>mem.lessons[id]||(mem.lessons[id]={done:false,best:0,tries:0,mist:{}});
/* ---------- bộ sinh câu hỏi: đáp án do chương trình tính ---------- */
function mk(text,ans,steps,mist,hint,unit){return{text,ans,steps,mist:mist||[],hint,unit:unit||""}}
const I=n=>({n,d:1});
const GEN={
int:[
 ()=>{const a=rnd(5,20),b=a+rnd(2,12);return mk(`Tính ${a} − ${b}`,I(a-b),[`Vì ${a} &lt; ${b} nên kết quả nhỏ hơn 0.`,`Lấy số lớn trừ số nhỏ: ${b} − ${a} = ${b-a}.`,`Thêm dấu âm: ${a} − ${b} = −${b-a}.`],[{v:I(b-a),msg:`Bạn lấy số lớn trừ số nhỏ nhưng quên dấu âm. Vì ${a} nhỏ hơn ${b} nên kết quả phải nhỏ hơn 0.`}],"Số bị trừ nhỏ hơn số trừ thì kết quả âm hay dương?")},
 ()=>{const a=rnd(2,15),b=rnd(2,15);return mk(`Tính ${a} − (−${b})`,I(a+b),[`Trừ đi một số âm bằng cộng với số đối của nó.`,`${a} − (−${b}) = ${a} + ${b}.`,`${a} + ${b} = ${a+b}.`],[{v:I(a-b),msg:`Bạn đã coi −(−${b}) như −${b}. Quy tắc: a − (−b) = a + b.`}],"Số đối của −"+"b là gì? Trừ một số bằng cộng với số đối của nó.")},
 ()=>{const a=rnd(2,15),b=rnd(2,15);return mk(`Tính (−${a}) − ${b}`,I(-a-b),[`Bắt đầu ở −${a}, trừ thêm ${b} nghĩa là đi xuống thêm ${b} đơn vị trên trục số.`,`(−${a}) − ${b} = (−${a}) + (−${b}).`,`Cộng hai số âm: −(${a} + ${b}) = −${a+b}.`],[{v:I(a+b),msg:`Kết quả phải âm: từ −${a} ta đi xuống thêm, không thể lên thành số dương.`},{v:I(b-a),msg:`Bạn đã trừ giá trị tuyệt đối. Hai số cùng âm thì cộng giá trị tuyệt đối rồi giữ dấu âm.`}],"Vẽ trục số: từ −a đi sang trái b bước.")},
 ()=>{const a=rnd(2,8),b=a+rnd(2,9);return mk(`Buổi sáng nhiệt độ là ${a}°C. Đến tối nhiệt độ giảm ${b}°C. Nhiệt độ buổi tối là bao nhiêu °C?`,I(a-b),[`Giảm ${b}°C nghĩa là lấy ${a} − ${b}.`,`Vì ${a} &lt; ${b} nên nhiệt độ xuống dưới 0°C.`,`${a} − ${b} = −${b-a}, tức là ${b-a}°C dưới 0.`],[{v:I(b-a),msg:`Nhiệt độ giảm nhiều hơn mức ban đầu nên xuống dưới 0°C, phải có dấu âm.`}],"So sánh mức giảm với nhiệt độ ban đầu.","°C")}
],
frac:[
 ()=>{const d=rnd(5,12),a=rnd(1,Math.floor(d/2)),b=rnd(1,d-a-1||1);const s=norm(a+b,d);return mk(`Tính ${F(a,d)} + ${F(b,d)}`,s,[`Hai phân số cùng mẫu ${d}: giữ nguyên mẫu, cộng các tử.`,`${a} + ${b} = ${a+b}, được ${F(a+b,d)}.`,`Rút gọn nếu có thể: ${Fo(s)}.`],[{v:norm(a+b,2*d),msg:`Bạn đã cộng cả hai mẫu. Cùng mẫu thì giữ nguyên mẫu, chỉ cộng tử.`}],"Cùng mẫu số thì mẫu số có đổi không?")},
 ()=>{const p=[[2,3],[3,4],[2,5],[4,6],[3,6],[2,4]][rnd(0,5)],[d1,d2]=p,a=rnd(1,d1-1),b=rnd(1,d2-1);const s=norm(a*d2+b*d1,d1*d2);return mk(`Tính ${F(a,d1)} + ${F(b,d2)}`,s,[`Hai mẫu khác nhau (${d1} và ${d2}), cần quy đồng mẫu.`,`Mẫu chung ${d1*d2}: ${F(a*d2,d1*d2)} + ${F(b*d1,d1*d2)}.`,`Cộng tử: ${F(a*d2+b*d1,d1*d2)} = ${Fo(s)} (đã rút gọn).`],[{v:norm(a+b,d1+d2),msg:`Không được cộng tử với tử và mẫu với mẫu. Phải quy đồng mẫu trước.`}],"Tìm mẫu chung của hai phân số trước.")},
 ()=>{let [d1,d2]=[[2,3],[3,4],[2,5],[3,6],[4,5]][rnd(0,4)];let a=rnd(1,d1-1),b=rnd(1,d2-1);if(a*d2<b*d1){[a,b]=[b,a];[d1,d2]=[d2,d1]}if(a*d2===b*d1){a=d1-1;b=1;d2=d1+1}const s=norm(a*d2-b*d1,d1*d2);return mk(`Tính ${F(a,d1)} − ${F(b,d2)}`,s,[`Quy đồng mẫu: mẫu chung ${d1*d2}.`,`${F(a*d2,d1*d2)} − ${F(b*d1,d1*d2)} = ${F(a*d2-b*d1,d1*d2)}.`,`Rút gọn: ${Fo(s)}.`],[{v:norm(a-b,d1-d2||1),msg:`Phép trừ phân số khác mẫu cũng phải quy đồng trước, không trừ trực tiếp tử và mẫu.`}],"Quy đồng mẫu rồi mới trừ tử.")},
 ()=>{const a=rnd(1,2),b=rnd(1,2),s=norm(a*4+b*3,12);return mk(`Lan ăn ${F(a,3)} cái bánh, Mai ăn ${F(b,4)} cái bánh cùng loại. Hai bạn ăn tất cả bao nhiêu phần cái bánh?`,s,[`Cần tính ${F(a,3)} + ${F(b,4)}.`,`Quy đồng mẫu 12: ${F(a*4,12)} + ${F(b*3,12)} = ${F(a*4+b*3,12)}.`,`Rút gọn: ${Fo(s)} cái bánh.`],[{v:norm(a+b,7),msg:`Hai phân số khác mẫu cần quy đồng trước khi cộng.`}],"Viết phép tính rồi quy đồng mẫu 12.")}
],
geo:[
 ()=>{const a=rnd(6,15),b=rnd(3,a-1);return mk(`Hình chữ nhật có chiều dài ${a} cm, chiều rộng ${b} cm. Tính diện tích (cm²).`,I(a*b),[`Diện tích hình chữ nhật = chiều dài × chiều rộng.`,`S = ${a} × ${b} = ${a*b} (cm²).`],[{v:I(2*(a+b)),msg:`Đó là chu vi. Diện tích là phần mặt phẳng bên trong, tính bằng dài × rộng.`}],"Dùng công thức S = a × b.","cm²")},
 ()=>{const a=rnd(6,18),b=rnd(3,a-1);return mk(`Hình chữ nhật có chiều dài ${a} cm, chiều rộng ${b} cm. Tính chu vi (cm).`,I(2*(a+b)),[`Chu vi hình chữ nhật = 2 × (dài + rộng).`,`P = 2 × (${a} + ${b}) = 2 × ${a+b} = ${2*(a+b)} (cm).`],[{v:I(a*b),msg:`Đó là diện tích. Chu vi là độ dài đường bao quanh: 2 × (dài + rộng).`},{v:I(a+b),msg:`Đó mới là nửa chu vi. Hãy nhân thêm 2.`}],"Chu vi là độ dài viền bao quanh hình.","cm")},
 ()=>{const a=rnd(3,14),area=rnd(0,1)===1;return mk(`Hình vuông có cạnh ${a} cm. Tính ${area?"diện tích (cm²)":"chu vi (cm)"}.`,I(area?a*a:4*a),area?[`Diện tích hình vuông = cạnh × cạnh.`,`S = ${a} × ${a} = ${a*a} (cm²).`]:[`Chu vi hình vuông = 4 × cạnh.`,`P = 4 × ${a} = ${4*a} (cm).`],[{v:I(area?4*a:a*a),msg:area?`Bạn đã tính chu vi. Diện tích hình vuông là cạnh × cạnh.`:`Bạn đã tính diện tích. Chu vi hình vuông là 4 × cạnh.`},{v:I(2*a),msg:`Bạn mới tính 2 × cạnh. Hình vuông có 4 cạnh bằng nhau.`}],area?"S = a × a":"Hình vuông có mấy cạnh bằng nhau?",area?"cm²":"cm")},
 ()=>{const a=rnd(5,12),b=rnd(3,a-1),P=2*(a+b);return mk(`Hình chữ nhật có chu vi ${P} cm và chiều dài ${a} cm. Tính chiều rộng (cm).`,I(b),[`Nửa chu vi = dài + rộng = ${P} : 2 = ${a+b} (cm).`,`Chiều rộng = ${a+b} − ${a} = ${b} (cm).`],[{v:I(P-a),msg:`Bạn lấy cả chu vi trừ chiều dài. Chu vi gồm hai lần (dài + rộng), nên phải chia 2 trước.`}],"Chia chu vi cho 2 để được dài + rộng.","cm")}
]};
/* ---------- nội dung bài học ---------- */
const LESSONS=[
{id:"int-tru",gen:"int",strand:"Số và Đại số",topic:"Số nguyên",title:"Phép trừ số nguyên",
 warm:`Buổi sáng nhiệt độ ở Sa Pa là 3°C. Tối đến nhiệt độ giảm 5°C. Nhiệt độ lúc tối là bao nhiêu? Phép tính 3 − 5 có kết quả không phải là số tự nhiên. Ta cần số nguyên âm.`,
 learn:`<h3>Quy tắc</h3><p><b>Muốn trừ số nguyên a cho số nguyên b</b>, ta cộng a với số đối của b:</p><p class="mark">a − b = a + (−b)</p><h3>Cách hiểu đơn giản</h3><p>Trên trục số, trừ b là đi sang <b>trái</b> b bước. Trừ một số âm thì đổi thành cộng, tức là đi sang <b>phải</b>.</p><h3>Lỗi thường gặp</h3><div class="warn">Khi số bị trừ nhỏ hơn số trừ (ví dụ 18 − 25), kết quả là số âm. Đừng bỏ quên dấu “−”.</div>`,
 ex:[{q:"Tính 18 − 25",s:["Phân tích: số bị trừ 18 nhỏ hơn số trừ 25 nên kết quả âm.","Phương pháp: 18 − 25 = 18 + (−25).","Thực hiện: lấy 25 − 18 = 7, rồi đặt dấu của số có giá trị tuyệt đối lớn hơn là dấu “−”.","Kết quả: −7. Kiểm tra: (−7) + 25 = 18."]},{q:"Tính 6 − (−4)",s:["Phân tích: trừ đi một số âm.","Phương pháp: 6 − (−4) = 6 + 4.","Kết quả: 10. Trên trục số ta đi sang phải 4 bước từ 6."]}],
 sum:["a − b = a + (−b).","a − (−b) = a + b.","Số bị trừ nhỏ hơn số trừ thì hiệu là số âm."]},
{id:"ps-cong",gen:"frac",strand:"Số và Đại số",topic:"Phân số",title:"Cộng, trừ phân số",
 warm:`Lan ăn một nửa cái bánh, Mai ăn một phần ba cái bánh cùng loại. Hai bạn ăn được bao nhiêu phần cái bánh? Để trả lời ta cần cộng hai phân số khác mẫu.`,
 learn:`<h3>Cùng mẫu</h3><p>Giữ nguyên mẫu, cộng (hoặc trừ) các tử: ${F(1,5)} + ${F(2,5)} = ${F(3,5)}.</p><h3>Khác mẫu</h3><p>Quy đồng mẫu số rồi cộng (hoặc trừ) các tử. Sau đó rút gọn nếu được.</p><p class="mark">Chỉ cộng tử với tử khi các phân số đã có cùng mẫu.</p><h3>Lỗi thường gặp</h3><div class="warn">Sai: ${F(1,2)} + ${F(1,3)} = ${F(2,5)}. Hai phần của hai chiếc bánh có độ lớn khác nhau nên không cộng mẫu được.</div>`,
 ex:[{q:`Tính ${F(1,2)} + ${F(1,3)}`,s:["Phân tích: hai mẫu khác nhau là 2 và 3.","Phương pháp: quy đồng mẫu, mẫu chung là 6 vì 6 chia hết cho cả 2 và 3.",`Thực hiện: ${F(3,6)} + ${F(2,6)} = ${F(5,6)}.`,`Kết quả: ${F(5,6)} (đã tối giản).`]}],
 sum:["Cùng mẫu: giữ mẫu, cộng tử.","Khác mẫu: quy đồng rồi cộng.","Nhập đáp án dạng a/b, nên rút gọn."]},
{id:"hh-hcn",gen:"geo",strand:"Hình học và Đo lường",topic:"Hình phẳng",title:"Chu vi và diện tích hình chữ nhật, hình vuông",
 warm:`Bố muốn lát gạch một căn phòng và đóng nẹp quanh chân tường. Đại lượng nào cho biết số gạch cần mua, đại lượng nào cho biết độ dài nẹp? Đó là diện tích và chu vi.`,
 learn:`<svg viewBox="0 0 260 120" role="img" aria-label="Hình chữ nhật chiều dài a, chiều rộng b"><rect x="30" y="20" width="200" height="70" fill="var(--accbg)" stroke="var(--acc)" stroke-width="3"/><text x="130" y="112" text-anchor="middle" fill="currentColor" font-size="14">dài a</text><text x="8" y="60" fill="currentColor" font-size="14">b</text></svg><h3>Hình chữ nhật</h3><p>Chu vi: <b>P = 2 × (a + b)</b>. Diện tích: <b>S = a × b</b>.</p><h3>Hình vuông cạnh a</h3><p>Chu vi: <b>P = 4 × a</b>. Diện tích: <b>S = a × a</b>.</p><h3>Lỗi thường gặp</h3><div class="warn">Nhầm chu vi với diện tích. Chu vi đo độ dài (cm), diện tích đo phần bề mặt (cm²).</div>`,
 ex:[{q:"Hình chữ nhật dài 9 cm, rộng 4 cm. Tính chu vi và diện tích.",s:["Phân tích: cần hai đại lượng khác nhau.","Chu vi: P = 2 × (9 + 4) = 26 (cm).","Diện tích: S = 9 × 4 = 36 (cm²).","Lưu ý đơn vị: cm cho chu vi, cm² cho diện tích."]}],
 sum:["P = 2 × (a + b); S = a × b.","Hình vuông: P = 4a; S = a × a.","Chu vi tính bằng cm, diện tích bằng cm²."]},
{id:"int-tap",gen:"z13",strand:"Số và Đại số",topic:"Số nguyên",title:"Tập hợp các số nguyên",
 warm:`Nhiệt độ ở Mát-xcơ-va là −5°C, ở Hà Nội là 20°C. Nhiệt độ nào thấp hơn? Muốn so sánh và gọi tên những số như −5, ta cần tập hợp các số nguyên.`,
 learn:`<p>Tập hợp các số nguyên gồm số nguyên dương, số 0 và số nguyên âm: ℤ = {…; −2; −1; 0; 1; 2; …}.</p><h3>Số đối</h3><p>Hai số nằm đối xứng nhau qua điểm 0 trên trục số là hai số đối nhau. Số đối của a là −a. Số đối của 0 là 0.</p><h3>Giá trị tuyệt đối</h3><p>|a| là khoảng cách từ a đến 0 nên luôn không âm: |−7| = 7, |7| = 7.</p><h3>So sánh</h3><p>Trên trục số, số nằm bên trái nhỏ hơn số nằm bên phải. Số âm nhỏ hơn 0 và nhỏ hơn mọi số dương.</p><div class="warn">Lỗi thường gặp: nghĩ −9 lớn hơn −2 vì 9 lớn hơn 2. Thực ra −9 nằm bên trái −2 nên −9 &lt; −2.</div>`,
 ex:[{q:"So sánh −7 và −3.",s:["Phân tích: cả hai đều âm.","Phương pháp: so sánh vị trí trên trục số, hoặc so sánh giá trị tuyệt đối rồi đảo chiều.","|−7| = 7 > 3 = |−3| nên −7 nằm bên trái −3.","Kết quả: −7 < −3."]}],
 sum:["Số đối của a là −a.","|a| là khoảng cách đến 0, không âm.","Hai số âm: giá trị tuyệt đối lớn hơn thì số đó nhỏ hơn."]},
{id:"int-cong",gen:"z14",strand:"Số và Đại số",topic:"Số nguyên",title:"Phép cộng số nguyên",
 warm:`Bình nợ 20 nghìn đồng, rồi được cho 50 nghìn đồng. Bình còn bao nhiêu tiền sau khi trả nợ? Ta cần cộng số âm với số dương.`,
 learn:`<h3>Cộng hai số nguyên cùng dấu</h3><p>Cộng hai giá trị tuyệt đối rồi đặt dấu chung: (−3) + (−4) = −7.</p><h3>Cộng hai số nguyên khác dấu</h3><p>Lấy giá trị tuyệt đối lớn trừ giá trị tuyệt đối nhỏ, rồi đặt dấu của số có giá trị tuyệt đối lớn hơn: (−9) + 4 = −5. Hai số đối nhau có tổng bằng 0.</p><div class="warn">Lỗi thường gặp: cộng luôn 9 + 4 = 13 khi hai số khác dấu.</div>`,
 ex:[{q:"Tính (−12) + 5",s:["Phân tích: hai số khác dấu.","|−12| = 12 lớn hơn |5| = 5, nên kết quả mang dấu “−”.","12 − 5 = 7.","Kết quả: −7. Kiểm tra: (−7) + 12 = 5."]}],
 sum:["Cùng dấu: cộng giá trị tuyệt đối, giữ dấu chung.","Khác dấu: trừ giá trị tuyệt đối, lấy dấu của số lớn hơn.","a + (−a) = 0."]},
{id:"int-ngoac",gen:"z15",strand:"Số và Đại số",topic:"Số nguyên",title:"Quy tắc dấu ngoặc",
 warm:`Tính 20 − (5 + 3) bằng hai cách: tính trong ngoặc trước, hoặc bỏ ngoặc rồi tính. Hai cách có cho cùng kết quả không? Quy tắc dấu ngoặc cho ta cách bỏ ngoặc đúng.`,
 learn:`<h3>Quy tắc</h3><p>Dấu “+” đứng trước ngoặc: bỏ ngoặc, giữ nguyên dấu các số hạng trong ngoặc.</p><p>Dấu “−” đứng trước ngoặc: bỏ ngoặc và đổi dấu tất cả các số hạng trong ngoặc.</p><p class="mark">a − (b − c) = a − b + c</p><div class="warn">Lỗi thường gặp: chỉ đổi dấu số hạng đầu tiên trong ngoặc mà quên các số còn lại.</div>`,
 ex:[{q:"Bỏ ngoặc rồi tính: 15 − (6 − 4)",s:["Phân tích: trước ngoặc là dấu “−”.","Đổi dấu mọi số hạng trong ngoặc: 15 − 6 + 4.","Tính: 15 − 6 = 9, 9 + 4 = 13.","Kiểm tra: 15 − (6 − 4) = 15 − 2 = 13."]}],
 sum:["Trước ngoặc là “+”: giữ nguyên dấu.","Trước ngoặc là “−”: đổi dấu tất cả.","Luôn kiểm tra lại bằng cách tính trong ngoặc trước."]},
{id:"int-nhan",gen:"z16",strand:"Số và Đại số",topic:"Số nguyên",title:"Phép nhân số nguyên",
 warm:`Mỗi giờ nhiệt độ giảm 2°C. Sau 3 giờ nhiệt độ thay đổi bao nhiêu? Đó là phép nhân (−2) × 3.`,
 learn:`<h3>Quy tắc dấu</h3><p>Khác dấu thì tích âm: (−4) × 3 = −12.</p><p>Cùng dấu thì tích dương: (−4) × (−3) = 12.</p><p>Nhân với 0 luôn bằng 0.</p><h3>Nhiều thừa số</h3><p>Đếm số thừa số âm: chẵn thì tích dương, lẻ thì tích âm.</p><div class="warn">Lỗi thường gặp: cho rằng âm nhân âm vẫn ra âm.</div>`,
 ex:[{q:"Tính (−2) × 5 × (−3)",s:["Phân tích: có hai thừa số âm, là số chẵn, nên tích dương.","Tính giá trị tuyệt đối: 2 × 5 × 3 = 30.","Kết quả: 30."]}],
 sum:["Khác dấu: tích âm.","Cùng dấu: tích dương.","Số thừa số âm chẵn: tích dương."]},
{id:"int-chia",gen:"z17",strand:"Số và Đại số",topic:"Số nguyên",title:"Phép chia hết. Ước và bội của một số nguyên",
 warm:`Có 12 viên kẹo chia đều cho các bạn. Có thể chia cho những số bạn nào để không thừa viên nào? Đó là ước của 12. Với số nguyên, mỗi ước dương còn có thêm số đối của nó.`,
 learn:`<h3>Chia hết</h3><p>Cho a, b là số nguyên, b ≠ 0. Nếu có số nguyên q sao cho a = b × q thì a chia hết cho b, ta viết a : b = q. Khi đó b là ước của a và a là bội của b.</p><h3>Quy tắc dấu</h3><p>(−12) : 3 = −4; (−12) : (−3) = 4. Dấu giống phép nhân.</p><h3>Ví dụ ước</h3><p>Các ước của 6 là ±1; ±2; ±3; ±6.</p><div class="warn">Lỗi thường gặp: chỉ kể các ước dương mà quên các ước âm.</div>`,
 ex:[{q:"Tìm các ước nguyên của 4.",s:["Ước dương của 4: 1, 2, 4.","Mỗi ước dương có thêm số đối: −1, −2, −4.","Các ước nguyên: ±1; ±2; ±4 (6 ước)."]}],
 sum:["a : b = q khi a = b × q.","Dấu của thương giống dấu của tích.","Mỗi số nguyên có cả ước dương và ước âm."]},
{id:'cd-chia',gen:'c8',strand:'Số và Đại số',topic:'Tính chia hết',title:'Quan hệ chia hết và tính chất',
 warm:`Có 17 cái kẹo chia đều cho 5 bạn thì mỗi bạn được mấy cái và còn thừa mấy cái? Phép chia có thể hết hoặc có dư.`,
 learn:`<p>Với a, b là số tự nhiên, b khác 0: nếu a = b × q thì a chia hết cho b, ta viết a ⋮ b. Khi đó a là bội của b, b là ước của a.</p><p>Phép chia có dư: a = b × q + r, với 0 ≤ r &lt; b.</p><h3>Tính chất</h3><p>Nếu a ⋮ m và b ⋮ m thì (a + b) ⋮ m và (a − b) ⋮ m (a ≥ b).</p><div class="warn">Số dư luôn nhỏ hơn số chia. Số dư 0 nghĩa là chia hết.</div>`,
 ex:[{q:'Tìm số dư khi chia 47 cho 6.',s:['Phân tích: tìm q để 6 × q gần 47 nhất mà không vượt quá.','6 × 7 = 42 và 6 × 8 = 48 > 47, nên q = 7.','Số dư: 47 − 42 = 5.','Kết quả: 47 = 6 × 7 + 5.']}],
 sum:['a ⋮ b khi a = b × q.','a = b × q + r với 0 ≤ r < b.','Tổng và hiệu của các số cùng chia hết cho m cũng chia hết cho m.']},
{id:'cd-dau',gen:'c9',strand:'Số và Đại số',topic:'Tính chia hết',title:'Dấu hiệu chia hết',
 warm:`Làm sao biết 2 358 có chia hết cho 9 hay không mà không cần đặt phép chia? Ta dùng dấu hiệu chia hết.`,
 learn:`<ul><li>Chia hết cho <b>2</b>: chữ số tận cùng là 0, 2, 4, 6, 8.</li><li>Chia hết cho <b>5</b>: chữ số tận cùng là 0 hoặc 5.</li><li>Chia hết cho <b>3</b>: tổng các chữ số chia hết cho 3.</li><li>Chia hết cho <b>9</b>: tổng các chữ số chia hết cho 9.</li></ul><div class="warn">Số chia hết cho 9 thì chia hết cho 3, nhưng ngược lại không đúng. Ví dụ 12 chia hết cho 3 mà không chia hết cho 9.</div>`,
 ex:[{q:'Số 2 358 có chia hết cho 9 không?',s:['Tổng các chữ số: 2 + 3 + 5 + 8 = 18.','18 chia hết cho 9.','Vậy 2 358 chia hết cho 9.']}],
 sum:['Dấu hiệu 2 và 5 nhìn chữ số tận cùng.','Dấu hiệu 3 và 9 dùng tổng các chữ số.','Chia hết cho 9 thì chia hết cho 3.']},
{id:'cd-nt',gen:'c10',strand:'Số và Đại số',topic:'Tính chia hết',title:'Số nguyên tố',
 warm:`Có thể xếp 7 viên bi thành hình chữ nhật có nhiều hơn một hàng và một cột không? Còn 8 viên thì sao? Câu trả lời liên quan đến số nguyên tố.`,
 learn:`<p><b>Số nguyên tố</b> là số tự nhiên lớn hơn 1, chỉ có hai ước là 1 và chính nó: 2, 3, 5, 7, 11, 13, …</p><p><b>Hợp số</b> là số lớn hơn 1 có nhiều hơn hai ước.</p><p>Mọi hợp số đều phân tích được thành tích các thừa số nguyên tố: 60 = 2² × 3 × 5.</p><div class="warn">Số 1 không là số nguyên tố, cũng không là hợp số. Số 2 là số nguyên tố chẵn duy nhất.</div>`,
 ex:[{q:'Phân tích 60 ra thừa số nguyên tố.',s:['Chia 60 cho số nguyên tố nhỏ nhất có thể: 60 : 2 = 30, 30 : 2 = 15.','15 : 3 = 5, 5 : 5 = 1.','Kết quả: 60 = 2 × 2 × 3 × 5 = 2² × 3 × 5.']}],
 sum:['Số nguyên tố có đúng hai ước.','1 không là số nguyên tố.','Phân tích bằng cách chia cho các số nguyên tố nhỏ dần.']},
{id:'cd-ucln',gen:'c11',strand:'Số và Đại số',topic:'Tính chia hết',title:'Ước chung. Ước chung lớn nhất',
 warm:`Cô giáo có 24 bút đỏ và 36 bút xanh, muốn chia thành các phần giống hệt nhau. Chia được nhiều phần nhất là bao nhiêu? Ta cần ước chung lớn nhất.`,
 learn:`<p>Ước chung của a và b là số chia hết cả a và b. <b>ƯCLN(a, b)</b> là ước chung lớn nhất.</p><h3>Cách tìm</h3><p>Phân tích các số ra thừa số nguyên tố, chọn các thừa số nguyên tố <b>chung</b>, lấy mỗi thừa số với số mũ <b>nhỏ nhất</b>, rồi nhân lại.</p><p>Ví dụ: 24 = 2³ × 3 và 36 = 2² × 3², nên ƯCLN = 2² × 3 = 12.</p><div class="warn">ƯCLN khác BCNN. ƯCLN không lớn hơn số nhỏ nhất trong các số.</div>`,
 ex:[{q:'Tìm ƯCLN(24, 36).',s:['24 = 2³ × 3; 36 = 2² × 3².','Thừa số chung: 2 (mũ nhỏ nhất là 2) và 3 (mũ nhỏ nhất là 1).','ƯCLN = 2² × 3 = 12.']}],
 sum:['ƯCLN: lấy thừa số chung với mũ nhỏ nhất.','ƯCLN không lớn hơn các số đã cho.','Dùng để rút gọn phân số và chia nhóm đều.']},
{id:'cd-bcnn',gen:'c12',strand:'Số và Đại số',topic:'Tính chia hết',title:'Bội chung. Bội chung nhỏ nhất',
 warm:`Lan trực nhật 4 ngày một lần, Mai 6 ngày một lần. Hôm nay hai bạn cùng trực. Sau bao nhiêu ngày thì lại cùng trực? Đó là bội chung nhỏ nhất.`,
 learn:`<p>Bội chung của a và b là số chia hết cho cả a và b. <b>BCNN(a, b)</b> là bội chung nhỏ nhất khác 0.</p><h3>Cách tìm</h3><p>Phân tích ra thừa số nguyên tố, chọn <b>tất cả</b> thừa số (chung và riêng), lấy mỗi thừa số với số mũ <b>lớn nhất</b>, rồi nhân lại.</p><p>Ví dụ: 4 = 2² và 6 = 2 × 3, nên BCNN = 2² × 3 = 12.</p><div class="warn">BCNN không phải luôn là tích a × b. Chỉ khi a và b không có ước chung nào khác 1 thì mới bằng tích.</div>`,
 ex:[{q:'Tìm BCNN(4, 6).',s:['4 = 2²; 6 = 2 × 3.','Lấy tất cả thừa số: 2 (mũ lớn nhất là 2) và 3.','BCNN = 2² × 3 = 12. Kiểm tra: 12 : 4 = 3 và 12 : 6 = 2.']}],
 sum:['BCNN: lấy mọi thừa số với mũ lớn nhất.','BCNN không nhỏ hơn số lớn nhất trong các số.','Dùng cho bài toán lặp lại cùng lúc.']},
{id:'ps-bang',gen:'f23',strand:'Số và Đại số',topic:'Phân số',title:'Mở rộng khái niệm phân số. Phân số bằng nhau',
 warm:`Cắt một cái bánh thành 4 phần bằng nhau và lấy 2 phần. Cắt một cái bánh khác thành 2 phần bằng nhau và lấy 1 phần. Hai cách lấy có bằng nhau không?`,
 learn:`<p>Phân số có dạng <b>a/b</b> với a, b là số nguyên và b khác 0.</p><h3>Phân số bằng nhau</h3><p>${F(2,4)} = ${F(1,2)} vì nhân hoặc chia cả tử và mẫu với cùng một số khác 0 thì được phân số bằng nó.</p><p class="mark">a/b = c/d khi a × d = b × c</p><h3>Phân số tối giản</h3><p>Là phân số mà tử và mẫu chỉ có ước chung là 1 và −1. Rút gọn bằng cách chia tử và mẫu cho ƯCLN.</p><div class="warn">Lỗi thường gặp: cộng cùng một số vào tử và mẫu. Từ ${F(1,2)} cộng 1 vào cả hai được ${F(2,3)}, khác ${F(1,2)}.</div>`,
 ex:[{q:`Tìm x biết ${F(2,3)} = x/12.`,s:['Mẫu 3 nhân với 4 thì được 12.','Tử cũng nhân với 4: 2 × 4 = 8.','Kết quả x = 8. Kiểm tra bằng tích chéo: 2 × 12 = 24 và 3 × 8 = 24.']}],
 sum:['Nhân hoặc chia tử và mẫu cho cùng một số khác 0 thì được phân số bằng nó.','a/b = c/d khi a × d = b × c.','Rút gọn bằng cách chia cho ƯCLN.']},
{id:'ps-sosanh',gen:'f24',strand:'Số và Đại số',topic:'Phân số',title:'So sánh phân số. Hỗn số dương',
 warm:`Một bạn ăn ${F(3,5)} cái pizza, bạn khác ăn ${F(2,3)} cái pizza cùng cỡ. Ai ăn nhiều hơn? Hai mẫu số khác nhau nên chưa so sánh ngay được.`,
 learn:`<p><b>Cùng mẫu dương:</b> phân số nào có tử lớn hơn thì lớn hơn.</p><p><b>Khác mẫu:</b> quy đồng mẫu rồi so sánh tử.</p><h3>Hỗn số</h3><p>Hỗn số gồm phần nguyên và phần phân số: 2${F(1,3)} = (2 × 3 + 1)/3 = ${F(7,3)}.</p><p>Ngược lại, ${F(7,3)}: lấy 7 chia 3 được thương 2 dư 1, nên bằng 2${F(1,3)}.</p><div class="warn">Lỗi thường gặp: khi khác mẫu, thấy tử lớn hơn thì cho là phân số lớn hơn.</div>`,
 ex:[{q:`So sánh ${F(3,5)} và ${F(2,3)}.`,s:['Quy đồng mẫu 15: 3/5 = 9/15 và 2/3 = 10/15.','9 < 10 nên 3/5 < 2/3.','Bạn ăn 2/3 cái pizza ăn nhiều hơn.']}],
 sum:['Cùng mẫu: so sánh tử.','Khác mẫu: quy đồng rồi so sánh tử.','Hỗn số q r/b = (q × b + r)/b.']},
{id:'ps-nhan',gen:'f26',strand:'Số và Đại số',topic:'Phân số',title:'Phép nhân và phép chia phân số',
 warm:`Một mảnh vườn hình chữ nhật dài ${F(3,2)} m và rộng ${F(1,3)} m. Diện tích bao nhiêu mét vuông? Ta cần nhân hai phân số.`,
 learn:`<p><b>Nhân:</b> nhân tử với tử, mẫu với mẫu: ${F(2,3)} × ${F(4,5)} = ${F(8,15)}.</p><p><b>Số nghịch đảo</b> của a/b là b/a (a khác 0).</p><p><b>Chia:</b> chia cho một phân số là nhân với số nghịch đảo: ${F(2,3)} : ${F(4,5)} = ${F(2,3)} × ${F(5,4)} = ${F(5,6)}.</p><p>Nên rút gọn kết quả về phân số tối giản.</p><div class="warn">Lỗi thường gặp: quy đồng mẫu khi nhân, hoặc quên lấy nghịch đảo khi chia.</div>`,
 ex:[{q:`Tính ${F(3,4)} : ${F(9,8)}`,s:['Đổi chia thành nhân với nghịch đảo: 3/4 × 8/9.','Nhân: 24/36.','Rút gọn cho 12: 2/3.']}],
 sum:['Nhân: tử × tử, mẫu × mẫu.','Chia: nhân với số nghịch đảo.','Luôn rút gọn kết quả.']},
{id:'ps-2bt',gen:'f27',strand:'Số và Đại số',topic:'Phân số',title:'Hai bài toán về phân số',
 warm:`Lớp có 36 bạn, ${F(1,3)} số bạn tham gia câu lạc bộ cờ vua. Có bao nhiêu bạn tham gia? Ngược lại nếu biết 12 bạn là ${F(1,3)} của cả lớp, lớp có bao nhiêu bạn?`,
 learn:`<h3>Bài toán 1: tìm giá trị phân số của một số</h3><p>Muốn tìm a/b của số n, ta nhân: n × a/b.</p><h3>Bài toán 2: tìm một số biết giá trị phân số của nó</h3><p>Muốn tìm số biết a/b của nó bằng m, ta chia: m : a/b.</p><div class="warn">Lỗi thường gặp: nhầm hai dạng. Biết toàn bộ, tìm một phần thì nhân. Biết một phần, tìm toàn bộ thì chia.</div>`,
 ex:[{q:`${F(3,4)} của một số bằng 18. Tìm số đó.`,s:['Biết giá trị của một phân số của số cần tìm nên dùng phép chia.','18 : 3/4 = 18 × 4/3.','Kết quả: 24. Kiểm tra: 3/4 của 24 là 18.']}],
 sum:['Tìm a/b của n: n × a/b.','Biết a/b của x bằng m: x = m : a/b.','Đọc kỹ đề để biết đang biết toàn bộ hay một phần.']},
{id:'td-so',gen:'g28',strand:'Số và Đại số',topic:'Số thập phân',title:'Số thập phân',
 warm:`Một chiếc bút giá 4,5 nghìn đồng, chiếc khác giá 4,25 nghìn đồng. Chiếc nào đắt hơn? Muốn so sánh đúng, ta cần hiểu cách đọc và so sánh số thập phân.`,
 learn:`<p>Số thập phân có phần nguyên, dấu phẩy và phần thập phân. Ví dụ 12,345 có phần nguyên 12 và ba chữ số thập phân.</p><p>Phân số thập phân là phân số có mẫu 10, 100, 1000, … Ta viết được thành số thập phân: ${F(37,100)} = 0,37. Mẫu có bao nhiêu chữ số 0 thì có bấy nhiêu chữ số sau dấu phẩy.</p><h3>So sánh</h3><p>So sánh phần nguyên trước. Nếu bằng nhau, so từng hàng thập phân từ trái sang phải. Với số âm, số có giá trị tuyệt đối lớn hơn thì nhỏ hơn.</p><div class="warn">Lỗi thường gặp: cho rằng 3,45 lớn hơn 3,5 vì 45 lớn hơn 5. Hãy viết 3,5 thành 3,50 rồi so sánh.</div>`,
 ex:[{q:'So sánh 3,45 và 3,5.',s:['Phần nguyên đều là 3.','Viết 3,5 = 3,50 để cùng số chữ số thập phân.','45 < 50 nên 3,45 < 3,50.','Kết quả: 3,5 lớn hơn.']}],
 sum:['Mẫu có k chữ số 0 thì có k chữ số thập phân.','Viết thêm chữ số 0 để so sánh dễ hơn.','Hai số âm: giá trị tuyệt đối lớn hơn thì nhỏ hơn.']},
{id:'td-tinh',gen:'g29',strand:'Số và Đại số',topic:'Số thập phân',title:'Tính toán với số thập phân',
 warm:`Mua một quyển vở giá 12,5 nghìn đồng và một hộp bút giá 14,75 nghìn đồng. Tổng cộng hết bao nhiêu tiền? Ta cần cộng hai số thập phân.`,
 learn:`<h3>Cộng, trừ</h3><p>Viết các số sao cho dấu phẩy thẳng cột (thêm chữ số 0 nếu cần), cộng hoặc trừ như số tự nhiên rồi đặt dấu phẩy thẳng cột.</p><h3>Nhân</h3><p>Nhân như số tự nhiên rồi đếm tổng số chữ số thập phân của hai thừa số để đặt dấu phẩy: 1,2 × 0,3 = 0,36.</p><h3>Chia</h3><p>Nhân cả số bị chia và số chia với 10, 100, … để số chia thành số tự nhiên rồi chia.</p><div class="warn">Lỗi thường gặp: cộng 1,2 với 3,45 thành 4,65 sai vì chưa thẳng cột. Phải viết 1,20 + 3,45 = 4,65. Cẩn thận khi chữ số cuối khác nhau.</div>`,
 ex:[{q:'Tính 1,2 × 0,5',s:['Nhân như số tự nhiên: 12 × 5 = 60.','Hai thừa số có tổng cộng 1 + 1 = 2 chữ số thập phân.','Kết quả: 0,60 = 0,6.']}],
 sum:['Cộng, trừ: thẳng cột dấu phẩy.','Nhân: đếm tổng số chữ số thập phân.','Chia: nhân cả hai số với 10, 100, …']},
{id:'td-lamtron',gen:'g30',strand:'Số và Đại số',topic:'Số thập phân',title:'Làm tròn và ước lượng',
 warm:`Giá chiếc áo là 198 nghìn đồng, ta thường nói “gần 200 nghìn”. Việc đó gọi là làm tròn.`,
 learn:`<p><b>Quy tắc làm tròn:</b> xét chữ số ngay sau hàng làm tròn. Nếu nó nhỏ hơn 5 thì giữ nguyên chữ số hàng làm tròn. Nếu nó từ 5 trở lên thì tăng chữ số hàng làm tròn thêm 1. Sau đó bỏ các chữ số bên phải.</p><p>Ví dụ: 5,27 làm tròn đến hàng phần mười là 5,3. Số 47 làm tròn đến hàng chục là 50.</p><h3>Ước lượng</h3><p>Làm tròn các số trước khi tính để biết kết quả gần đúng.</p><div class="warn">Lỗi thường gặp: chỉ bỏ các chữ số đi (cắt bớt) mà không xét chữ số tiếp theo.</div>`,
 ex:[{q:'Làm tròn 4,76 đến hàng phần mười.',s:['Hàng phần mười là chữ số 7.','Chữ số tiếp theo là 6, từ 5 trở lên nên tăng 7 thành 8.','Kết quả: 4,8.']}],
 sum:['Chữ số sau từ 5 trở lên: tăng thêm 1.','Chữ số sau nhỏ hơn 5: giữ nguyên.','Ước lượng bằng cách làm tròn trước khi tính.']},
{id:'td-tile',gen:'g31',strand:'Số và Đại số',topic:'Số thập phân',title:'Một số bài toán về tỉ số và tỉ số phần trăm',
 warm:`Cửa hàng giảm giá 20%. Áo giá 150 nghìn đồng thì còn bao nhiêu? Ta cần hiểu tỉ số phần trăm.`,
 learn:`<p>Tỉ số của a và b là a : b, hay ${F(1,4)} nếu a = 1, b = 4. <b>Tỉ số phần trăm</b> viết là a% và có nghĩa ${F(1,100)} × a.</p><p>Viết phân số thành phần trăm: nhân với 100 rồi thêm dấu %. Ví dụ ${F(3,5)} = 60%.</p><h3>Tìm p% của N</h3><p>N × p : 100. Ví dụ 25% của 80 là 80 × 25 : 100 = 20.</p><div class="warn">Lỗi thường gặp: giảm giá 20% mà lấy 20 làm giá tiền sau giảm, hoặc nhầm số tiền giảm với giá sau giảm.</div>`,
 ex:[{q:'Áo giá 150 nghìn đồng, giảm 20%. Giá sau giảm?',s:['Số tiền giảm: 150 × 20 : 100 = 30.','Giá sau giảm: 150 − 30 = 120.','Kết quả: 120 nghìn đồng.']}],
 sum:['a% = a/100.','p% của N = N × p : 100.','Giá sau giảm = giá gốc − số tiền giảm.']},
{id:'tn-tap',gen:'h1',strand:'Số và Đại số',topic:'Số tự nhiên',title:'Tập hợp',
 warm:`Mỗi tổ trong lớp là một nhóm bạn. Ta có thể nói “tổ 1” là một tập hợp, mỗi bạn trong tổ là một phần tử của tập hợp đó.`,
 learn:`<p>Tập hợp là một nhóm các đối tượng xác định. Mỗi đối tượng là một <b>phần tử</b>. Ta kí hiệu tập hợp bằng chữ cái in hoa: A = {2; 4; 6}.</p><p>“4 ∈ A” đọc là 4 thuộc A. “5 ∉ A” đọc là 5 không thuộc A.</p><h3>Hai cách cho tập hợp</h3><p>Liệt kê các phần tử: B = {0; 1; 2; 3}. Hoặc nêu tính chất đặc trưng: B = {x ∈ ℕ | x &lt; 4}.</p><p>Tập hợp các số tự nhiên là ℕ = {0; 1; 2; 3; …}. ℕ* là tập hợp các số tự nhiên khác 0.</p><div class="warn">Lỗi thường gặp: quên số 0 khi liệt kê các số tự nhiên. Trong ℕ, số 0 là một phần tử.</div>`,
 ex:[{q:'Liệt kê các phần tử của C = {x ∈ ℕ | x < 5}. Tập hợp có mấy phần tử?',s:['Phân tích: x là số tự nhiên nhỏ hơn 5.','Liệt kê: C = {0; 1; 2; 3; 4}, nhớ có số 0.','Kết quả: C có 5 phần tử.']}],
 sum:['∈ là thuộc, ∉ là không thuộc.','Có hai cách cho tập hợp: liệt kê hoặc nêu tính chất đặc trưng.','ℕ bắt đầu từ 0.']},
{id:'tn-ghi',gen:'h2',strand:'Số và Đại số',topic:'Số tự nhiên',title:'Cách ghi số tự nhiên',
 warm:`Cùng là chữ số 7 nhưng trong 7 và 70 và 700 thì 7 mỗi lần một giá trị. Việc đó do cách ghi số theo hàng.`,
 learn:`<p>Hệ thập phân dùng 10 chữ số 0 đến 9. Mỗi chữ số có giá trị phụ thuộc vị trí (hàng): đơn vị, chục, trăm, nghìn, … Ví dụ 3 058 = 3 × 1000 + 0 × 100 + 5 × 10 + 8.</p><h3>Số La Mã</h3><p>I = 1, V = 5, X = 10. Viết các chữ cạnh nhau thì cộng lại: XII = 12. Chữ nhỏ đứng trước chữ lớn thì trừ: IV = 4, IX = 9. Không viết một chữ quá ba lần liền nhau.</p><div class="warn">Lỗi thường gặp: đọc XIV là 16 vì cộng cả I và V. Đúng là X + (V − I) = 14.</div>`,
 ex:[{q:'Đọc số La Mã XXIX.',s:['Tách thành nhóm: XX và IX.','XX = 20 và IX = 10 − 1 = 9.','Kết quả: 29.']}],
 sum:['Giá trị chữ số phụ thuộc hàng.','Số La Mã: nhỏ trước lớn thì trừ, ngược lại thì cộng.','Chữ số 0 ở giữa vẫn phải ghi.']},
{id:'tn-thutu',gen:'h3',strand:'Số và Đại số',topic:'Số tự nhiên',title:'Thứ tự trong tập hợp các số tự nhiên',
 warm:`Bạn An cao 148 cm, bạn Bình cao 152 cm. Ai cao hơn? So sánh số giúp ta sắp xếp thứ tự.`,
 learn:`<p>Trên tia số, số nằm bên trái nhỏ hơn số nằm bên phải. Viết a &lt; b, a ≤ b, a &gt; b, a ≥ b.</p><p>Mỗi số tự nhiên có một số liền sau (thêm 1). Số 0 là số nhỏ nhất, và không có số lớn nhất. Số liền trước của a là a − 1 (với a khác 0).</p><p>So sánh hai số: số nào có nhiều chữ số hơn thì lớn hơn. Nếu cùng số chữ số, so từng cặp chữ số từ trái sang phải.</p><div class="warn">Lỗi thường gặp: với x &lt; 7, quên số 0 hoặc lấy cả số 7.</div>`,
 ex:[{q:'Sắp xếp 305; 53; 530 tăng dần.',s:['53 có 2 chữ số nên nhỏ nhất.','305 và 530 cùng 3 chữ số: 3 < 5 nên 305 < 530.','Kết quả: 53 < 305 < 530.']}],
 sum:['Số bên trái trên tia số thì nhỏ hơn.','Liền sau: +1, liền trước: −1.','0 là số nhỏ nhất.']},
{id:'tn-congtru',gen:'k4',strand:'Số và Đại số',topic:'Số tự nhiên',title:'Phép cộng và phép trừ số tự nhiên',
 warm:`Tính nhanh 37 + 48 + 63 trong đầu. Nếu ghép 37 với 63 thì được tròn 100 và việc cộng dễ hơn nhiều.`,
 learn:`<p>Phép cộng có tính chất <b>giao hoán</b>: a + b = b + a và <b>kết hợp</b>: (a + b) + c = a + (b + c). Nhờ đó ta ghép các số để được tổng tròn.</p><p>Phép trừ: a − b − c = a − (b + c). Phép trừ chỉ thực hiện được trong ℕ khi số bị trừ lớn hơn hoặc bằng số trừ.</p><div class="warn">Lỗi thường gặp: viết a − b − c = a − b + c. Số c cũng bị trừ đi.</div>`,
 ex:[{q:'Tính nhanh 37 + 48 + 63',s:['Phân tích: 37 + 63 = 100.','Dùng giao hoán và kết hợp: (37 + 63) + 48.','100 + 48 = 148.']}],
 sum:['Giao hoán và kết hợp giúp ghép số tròn.','a − b − c = a − (b + c).','Trừ trong ℕ cần số bị trừ ≥ số trừ.']},
{id:'tn-nhanchia',gen:'k5',strand:'Số và Đại số',topic:'Số tự nhiên',title:'Phép nhân và phép chia số tự nhiên',
 warm:`Mỗi hộp có 12 cây bút, có 8 hộp. Bao nhiêu cây bút? Nếu chia đều cho 6 bạn thì mỗi bạn được bao nhiêu? Hai phép tính nhân và chia.`,
 learn:`<p>Nhân có giao hoán, kết hợp, và <b>phân phối</b> đối với phép cộng: a × (b + c) = a × b + a × c. Tương tự với phép trừ: a × b − a × c = a × (b − c).</p><p>Chia có dư: a = b × q + r với 0 ≤ r &lt; b. Khi r = 0 thì chia hết. Không chia cho 0.</p><div class="warn">Lỗi thường gặp: tìm số biết thương và số dư mà quên cộng số dư.</div>`,
 ex:[{q:'Tính nhanh 37 × 99 + 37',s:['Phân tích: có thừa số chung 37.','37 × 99 + 37 × 1 = 37 × (99 + 1).','37 × 100 = 3700.']}],
 sum:['a × (b ± c) = a × b ± a × c.','a = b × q + r, 0 ≤ r < b.','Không chia cho 0.']},
{id:'tn-luythua',gen:'k6',strand:'Số và Đại số',topic:'Số tự nhiên',title:'Luỹ thừa với số mũ tự nhiên',
 warm:`Mỗi lần gấp đôi một tờ giấy thì số lớp gấp nhân đôi. Gấp 5 lần được 2 × 2 × 2 × 2 × 2 lớp. Viết gọn là 2<sup>5</sup>.`,
 learn:`<p>a<sup>n</sup> = a × a × … × a (n thừa số a). a là cơ số, n là số mũ. a<sup>1</sup> = a. Bình phương a<sup>2</sup>, lập phương a<sup>3</sup>.</p><p>Nhân: a<sup>m</sup> × a<sup>n</sup> = a<sup>m+n</sup>. Chia: a<sup>m</sup> : a<sup>n</sup> = a<sup>m−n</sup> (m ≥ n, a khác 0).</p><div class="warn">Lỗi thường gặp: cho 2<sup>3</sup> = 2 × 3 = 6. Đúng là 2 × 2 × 2 = 8.</div>`,
 ex:[{q:'Viết 3<sup>4</sup> × 3<sup>2</sup> dưới dạng một luỹ thừa.',s:['Cùng cơ số 3 nên giữ cơ số, cộng số mũ.','4 + 2 = 6.','Kết quả: 3<sup>6</sup>.']}],
 sum:['a<sup>n</sup> là tích của n thừa số a.','Nhân: cộng số mũ. Chia: trừ số mũ.','a<sup>1</sup> = a.']},
{id:'tn-thutuphep',gen:'k7',strand:'Số và Đại số',topic:'Số tự nhiên',title:'Thứ tự thực hiện các phép tính',
 warm:`Tính 2 + 3 × 4. Một bạn được 20, bạn khác được 14. Ai đúng? Ta cần quy tắc về thứ tự thực hiện.`,
 learn:`<p>Biểu thức không có ngoặc: luỹ thừa trước, rồi nhân và chia, cuối cùng cộng và trừ. Các phép cùng cấp thì làm từ trái sang phải.</p><p>Có ngoặc: làm trong ngoặc tròn ( ) trước, rồi ngoặc vuông [ ], rồi ngoặc nhọn { }.</p><div class="warn">Lỗi thường gặp: cộng trước rồi nhân, ví dụ 2 + 3 × 4 = 5 × 4 = 20 là sai. Đúng là 2 + 12 = 14.</div>`,
 ex:[{q:'Tính 30 − [4 + (7 − 2)]',s:['Ngoặc tròn trước: 7 − 2 = 5.','Ngoặc vuông: 4 + 5 = 9.','30 − 9 = 21.']}],
 sum:['Luỹ thừa, nhân chia, rồi cộng trừ.','Cùng cấp: trái sang phải.','Ngoặc: ( ) rồi [ ] rồi { }.']},
{id:'hh-deu',gen:'m18',strand:'Hình học và Đo lường',topic:'Hình phẳng',title:'Hình tam giác đều. Hình vuông. Hình lục giác đều',
 warm:`Tổ ong xây các ngăn hình lục giác giống hệt nhau, khít với nhau không hở. Vì sao chúng đều và đẹp như vậy?`,
 learn:`<p><b>Tam giác đều:</b> 3 cạnh bằng nhau, 3 góc bằng nhau. <b>Hình vuông:</b> 4 cạnh bằng nhau, 4 góc vuông. <b>Lục giác đều:</b> 6 cạnh bằng nhau, 6 góc bằng nhau.</p><p>Chu vi = (số cạnh) × (độ dài một cạnh): tam giác đều 3a, hình vuông 4a, lục giác đều 6a.</p><div class="warn">Lỗi thường gặp: nhầm số cạnh của các hình khi tính chu vi.</div>`,
 ex:[{q:'Lục giác đều cạnh 5 cm. Tính chu vi.',s:['Phân tích: có 6 cạnh bằng nhau.','P = 6 × 5 = 30 (cm).']}],
 sum:['Tam giác đều 3 cạnh, vuông 4, lục giác đều 6.','Chu vi = số cạnh × cạnh.','Các cạnh và góc đều bằng nhau.']},
{id:'hh-tugiac',gen:'m19',strand:'Hình học và Đo lường',topic:'Hình phẳng',title:'Hình chữ nhật. Hình thoi. Hình bình hành. Hình thang cân',
 warm:`Một mặt bàn, một viên gạch men, một mái nhà nhìn nghiêng đều là các tứ giác khác nhau. Mỗi loại có tính chất riêng.`,
 learn:`<ul><li><b>Hình chữ nhật:</b> 4 góc vuông, cạnh đối bằng nhau, hai đường chéo bằng nhau.</li><li><b>Hình thoi:</b> 4 cạnh bằng nhau, hai đường chéo vuông góc.</li><li><b>Hình bình hành:</b> cạnh đối song song và bằng nhau, góc đối bằng nhau.</li><li><b>Hình thang cân:</b> hai cạnh đáy song song, hai cạnh bên bằng nhau, hai đường chéo bằng nhau.</li></ul><div class="warn">Lỗi thường gặp: cho rằng hình chữ nhật có 4 cạnh bằng nhau, hay hình bình hành có góc vuông.</div>`,
 ex:[{q:'Hình thoi có cạnh 6 cm. Chu vi bao nhiêu?',s:['Hình thoi có 4 cạnh bằng nhau.','P = 4 × 6 = 24 (cm).']}],
 sum:['Chữ nhật: góc vuông.','Thoi: 4 cạnh bằng nhau.','Bình hành: cạnh đối song song, bằng nhau.']},
{id:'hh-tugiac2',gen:'m20',strand:'Hình học và Đo lường',topic:'Hình phẳng',title:'Chu vi và diện tích hình thoi, hình bình hành, hình thang cân',
 warm:`Muốn trải thảm cho một mảnh đất hình thang, ta cần biết diện tích của nó.`,
 learn:`<ul><li><b>Hình bình hành:</b> S = cạnh đáy × chiều cao (đường vuông góc với đáy). Chu vi P = 2 × (a + b).</li><li><b>Hình thoi:</b> S = (d₁ × d₂) : 2 với d₁, d₂ là hai đường chéo. Chu vi P = 4a.</li><li><b>Hình thang cân:</b> S = (a + b) × h : 2 với a, b là hai đáy. Chu vi P = a + b + 2c (c là cạnh bên).</li></ul><div class="warn">Lỗi thường gặp: dùng cạnh bên thay cho chiều cao, hoặc quên chia 2.</div>`,
 ex:[{q:'Hình thoi có hai đường chéo 8 cm và 6 cm. Diện tích?',s:['S = (8 × 6) : 2.','8 × 6 = 48, 48 : 2 = 24 (cm²).']}],
 sum:['S bình hành = đáy × cao.','S thoi = d₁ × d₂ : 2.','S thang = (a + b) × h : 2.']},
{id:'dx-truc',gen:'m21',strand:'Hình học và Đo lường',topic:'Đối xứng',title:'Hình có trục đối xứng',
 warm:`Gấp đôi một tờ giấy rồi cắt hình trái tim. Mở ra, hai nửa trùng nhau qua nếp gấp. Nếp gấp đó là trục đối xứng.`,
 learn:`<p>Đường thẳng d là <b>trục đối xứng</b> của hình nếu gấp hình theo d thì hai phần trùng nhau. Hai điểm đối xứng qua d cách đều d.</p><p>Số trục: tam giác đều 3, hình vuông 4, hình chữ nhật 2, hình thoi 2, hình thang cân 1, lục giác đều 6, hình bình hành (thường) 0.</p><div class="warn">Lỗi thường gặp: cho hai đường chéo của hình chữ nhật là trục đối xứng. Thực ra chỉ hai đường nối trung điểm các cạnh đối là trục.</div>`,
 ex:[{q:'Chữ H có trục đối xứng không?',s:['Gấp chữ H theo đường thẳng đứng ở giữa: hai nửa trùng nhau.','Gấp theo đường ngang ở giữa cũng trùng nhau.','Kết quả: chữ H có 2 trục đối xứng.']}],
 sum:['Trục đối xứng: gấp hai nửa trùng nhau.','Điểm đối xứng cách đều trục.','Nhớ số trục của các hình quen thuộc.']},
{id:'dx-tam',gen:'m22',strand:'Hình học và Đo lường',topic:'Đối xứng',title:'Hình có tâm đối xứng',
 warm:`Quay một quạt gió nửa vòng quanh tâm, hình dạng vẫn như cũ. Điểm tâm đó là tâm đối xứng.`,
 learn:`<p>Điểm O là <b>tâm đối xứng</b> của hình nếu quay hình nửa vòng (180°) quanh O thì được hình trùng với hình ban đầu. O là trung điểm của mọi đoạn nối hai điểm đối xứng qua O.</p><p>Có tâm đối xứng: hình chữ nhật, hình vuông, hình thoi, hình bình hành, lục giác đều, hình tròn. Không có: tam giác đều, hình thang cân.</p><div class="warn">Lỗi thường gặp: nhầm có trục đối xứng với có tâm đối xứng. Hình bình hành có tâm nhưng thường không có trục.</div>`,
 ex:[{q:'A và A′ đối xứng qua O, OA = 4 cm. AA′ bao nhiêu?',s:['O là trung điểm của AA′.','AA′ = 2 × OA = 8 (cm).']}],
 sum:['Tâm đối xứng: quay 180° thì trùng.','O là trung điểm AA′.','Có trục và có tâm là hai tính chất khác nhau.']},
{id:'hc-diem',gen:'n32',strand:'Hình học và Đo lường',topic:'Hình học cơ bản',title:'Điểm và đường thẳng',
 warm:`Hai cây cọc cho trước, căng một sợi dây qua cả hai. Có mấy cách căng dây thẳng?`,
 learn:`<p>Điểm được kí hiệu bằng chữ cái in hoa. Đường thẳng kéo dài vô hạn về hai phía.</p><p>Qua hai điểm phân biệt có <b>một và chỉ một</b> đường thẳng. Ba điểm cùng nằm trên một đường thẳng gọi là <b>thẳng hàng</b>. Hai đường thẳng phân biệt có nhiều nhất một điểm chung.</p><div class="warn">Lỗi thường gặp: đếm AB và BA là hai đường thẳng khác nhau. Thực ra chúng là một.</div>`,
 ex:[{q:'Có 4 điểm, không có ba điểm nào thẳng hàng. Vẽ được bao nhiêu đường thẳng?',s:['Mỗi điểm nối với 3 điểm còn lại: 4 × 3 = 12 cách.','Mỗi đường được đếm hai lần: 12 : 2 = 6.']}],
 sum:['Qua hai điểm có một đường thẳng duy nhất.','Thẳng hàng: cùng nằm trên một đường thẳng.','n điểm không thẳng hàng: n(n−1):2 đường thẳng.']},
{id:'hc-giua',gen:'n33',strand:'Hình học và Đo lường',topic:'Hình học cơ bản',title:'Điểm nằm giữa hai điểm. Tia',
 warm:`Trên con đường thẳng từ nhà An đến nhà Cường, nhà Bình nằm ở giữa. Ta nói Bình nằm giữa An và Cường.`,
 learn:`<p>Ba điểm A, B, C thẳng hàng. Nếu B nằm giữa A và C thì <b>AB + BC = AC</b>.</p><p><b>Tia Ox</b> gồm gốc O và mọi điểm cùng phía với x đối với O. Hai tia chung gốc và tạo thành một đường thẳng là <b>hai tia đối nhau</b>.</p><div class="warn">Lỗi thường gặp: coi tia AB và tia BA là hai tia đối nhau. Hai tia này không chung gốc.</div>`,
 ex:[{q:'B nằm giữa A và C, AB = 3 cm, AC = 8 cm. Tính BC.',s:['B nằm giữa nên AB + BC = AC.','BC = 8 − 3 = 5 (cm).']}],
 sum:['B nằm giữa A, C: AB + BC = AC.','Tia có gốc, không có điểm cuối.','Hai tia đối nhau chung gốc và tạo đường thẳng.']},
{id:'hc-doan',gen:'n34',strand:'Hình học và Đo lường',topic:'Hình học cơ bản',title:'Đoạn thẳng. Độ dài đoạn thẳng',
 warm:`Dùng thước đo bảng này dài bao nhiêu? Mỗi đoạn thẳng có một độ dài xác định.`,
 learn:`<p><b>Đoạn thẳng AB</b> gồm hai điểm A, B và các điểm nằm giữa. Độ dài là một số dương. Đổi đơn vị: 1 m = 100 cm, 1 cm = 10 mm.</p><p>Đường gấp khúc ABCD có độ dài bằng tổng AB + BC + CD.</p><div class="warn">Lỗi thường gặp: cộng độ dài khi chưa đổi về cùng đơn vị.</div>`,
 ex:[{q:'Đổi 2 m 15 cm ra cm.',s:['2 m = 200 cm.','200 + 15 = 215 (cm).']}],
 sum:['1 m = 100 cm.','Đổi về cùng đơn vị trước khi tính.','Đường gấp khúc = tổng các đoạn.']},
{id:'hc-trungdiem',gen:'n35',strand:'Hình học và Đo lường',topic:'Hình học cơ bản',title:'Trung điểm của đoạn thẳng',
 warm:`Muốn chia đôi một sợi dây thì gấp sao cho hai đầu trùng nhau. Chỗ gấp là trung điểm.`,
 learn:`<p>Điểm M là <b>trung điểm</b> của AB nếu M nằm giữa A, B và MA = MB. Khi đó AM = MB = AB : 2.</p><p>Mỗi đoạn thẳng có đúng một trung điểm. Trên trục số, trung điểm của hai điểm người ta ứng với x và y là (x + y) : 2.</p><div class="warn">Lỗi thường gặp: chỉ cần MA = MB là kết luận trung điểm. Còn phải có M nằm trên AB.</div>`,
 ex:[{q:'M là trung điểm AB, AB = 10 cm. AM = ?',s:['AM = AB : 2.','10 : 2 = 5 (cm).']}],
 sum:['M nằm giữa A, B và MA = MB.','AM = AB : 2.','Có đúng một trung điểm.']},
{id:'hc-goc',gen:'n36',strand:'Hình học và Đo lường',topic:'Hình học cơ bản',title:'Góc',
 warm:`Hai kim đồng hồ cùng xuất phát từ một điểm tạo thành một góc.`,
 learn:`<p><b>Góc</b> là hình gồm hai tia chung gốc. Gốc chung là <b>đỉnh</b>, hai tia là hai <b>cạnh</b>. Góc xOy có đỉnh O, cạnh Ox, Oy.</p><p><b>Góc bẹt</b> có hai cạnh là hai tia đối nhau. Kí hiệu góc: ∠xOy.</p><div class="warn">Lỗi thường gặp: ghi đỉnh ở đầu hoặc cuối. Đỉnh luôn viết ở giữa: xOy.</div>`,
 ex:[{q:'Có 3 tia chung gốc O. Tạo được mấy góc?',s:['Mỗi cặp tia là một góc.','3 tia có 3 cặp. Kết quả: 3 góc.']}],
 sum:['Góc: hai tia chung gốc.','Đỉnh ở giữa khi đọc tên góc.','Góc bẹt: hai tia đối nhau.']},
{id:'hc-sodo',gen:'n37',strand:'Hình học và Đo lường',topic:'Hình học cơ bản',title:'Số đo góc',
 warm:`Cánh cửa mở rộng bao nhiêu? Ta dùng thước đo độ để nói chính xác.`,
 learn:`<p>Số đo góc tính bằng độ: 1°. Góc nhọn: 0° &lt; góc &lt; 90°. Góc vuông: 90°. Góc tù: 90° &lt; góc &lt; 180°. Góc bẹt: 180°.</p><p>Nếu tia Oz nằm giữa hai tia Ox, Oy thì <b>xOz + zOy = xOy</b>.</p><div class="warn">Lỗi thường gặp: nhầm góc nhọn và góc tù, hoặc đọc sai vạch đo trên thước.</div>`,
 ex:[{q:'xOz = 35°, zOy = 50°, Oz nằm giữa. xOy = ?',s:['Oz nằm giữa: xOy = xOz + zOy.','35° + 50° = 85°, là góc nhọn.']}],
 sum:['Nhọn < 90°, vuông = 90°, tù > 90°, bẹt = 180°.','Oz nằm giữa: xOz + zOy = xOy.','Đọc đúng vạch đo trên thước.']},
{id:'tk-thuthap',gen:'p38',strand:'Thống kê và Xác suất',topic:'Dữ liệu',title:'Dữ liệu và thu thập dữ liệu',
 warm:`Lớp muốn biết món ăn nào được yêu thích nhất. Ta phải hỏi từng bạn rồi ghi lại kết quả. Đó là thu thập dữ liệu.`,
 learn:`<p>Thông tin thu được gọi là <b>dữ liệu</b>. Dữ liệu có thể là số (chiều cao, số quyển sách) hoặc không phải số (màu sắc, món ăn).</p><p>Cách thu thập: quan sát, phỏng vấn, lập phiếu hỏi, dùng bảng kiểm đếm. Dữ liệu tốt cần <b>chính xác</b>, <b>hợp lí</b> và đúng mục đích.</p><div class="warn">Lỗi thường gặp: đếm trùng hoặc bỏ sót khi kiểm đếm.</div>`,
 ex:[{q:'Các dữ liệu: số bạn mỗi tổ là 8, 9, 7, 8. Tổng số bạn?',s:['Đây là dữ liệu số.','8 + 9 + 7 + 8 = 32.']}],
 sum:['Dữ liệu: số hoặc không phải số.','Thu thập: quan sát, phỏng vấn, phiếu hỏi.','Dữ liệu phải chính xác, hợp lí.']},
{id:'tk-bang',gen:'p39',strand:'Thống kê và Xác suất',topic:'Dữ liệu',title:'Bảng thống kê và biểu đồ tranh',
 warm:`Thay vì viết một dãy số dài, ta xếp dữ liệu vào bảng cho dễ nhìn.`,
 learn:`<p><b>Bảng thống kê</b> liệt kê mỗi loại dữ liệu và số lần xuất hiện. <b>Biểu đồ tranh</b> dùng biểu tượng, mỗi biểu tượng ứng với một số đơn vị. Nửa biểu tượng ứng với nửa số đó.</p><div class="warn">Lỗi thường gặp: đếm số biểu tượng mà quên nhân với số đơn vị của mỗi biểu tượng, hoặc bỏ nửa biểu tượng.</div>`,
 ex:[{q:'Mỗi ● ứng với 4 bạn. Hàng ●●● có bao nhiêu bạn?',s:['3 biểu tượng.','3 × 4 = 12 bạn.']}],
 sum:['Mỗi biểu tượng ứng với một số đơn vị.','Nửa biểu tượng ứng nửa số đơn vị.','Đọc chú thích trước khi đọc biểu đồ.']},
{id:'tk-cot',gen:'p40',strand:'Thống kê và Xác suất',topic:'Dữ liệu',title:'Biểu đồ cột',
 warm:`Nhìn cột cao hơn là biết món nào được thích hơn. Biểu đồ cột giúp so sánh nhanh.`,
 learn:`<p><b>Biểu đồ cột</b> dùng các cột có độ cao tương ứng với số liệu. Đọc: nhìn nhãn bên dưới, đọc số trên đầu cột. Trung bình = tổng : số cột.</p><div class="warn">Lỗi thường gặp: đọc nhầm cột bên cạnh, hoặc lấy số lớn nhất làm trung bình.</div>`,
 ex:[{q:'Các cột cao 4, 6, 8. Trung bình?',s:['Tổng: 4 + 6 + 8 = 18.','18 : 3 = 6.']}],
 sum:['Đọc nhãn và số trên đầu cột.','So sánh độ cao các cột.','Trung bình = tổng : số cột.']},
{id:'tk-cotkep',gen:'p41',strand:'Thống kê và Xác suất',topic:'Dữ liệu',title:'Biểu đồ cột kép',
 warm:`So sánh điểm số thích môn học của hai lớp trên cùng một biểu đồ.`,
 learn:`<p><b>Biểu đồ cột kép</b> có hai cột cạnh nhau cho mỗi loại, mỗi màu là một nhóm. Dùng chú giải để biết màu nào là nhóm nào.</p><div class="warn">Lỗi thường gặp: nhầm màu cột giữa hai nhóm.</div>`,
 ex:[{q:'Cột xanh 7, cột vàng 4. Chênh lệch?',s:['7 − 4 = 3.']}],
 sum:['Hai cột cạnh nhau, hai nhóm.','Xem chú giải màu.','Chênh lệch = số lớn trừ số bé.']},
{id:'xs-kqkn',gen:'p42',strand:'Thống kê và Xác suất',topic:'Xác suất',title:'Kết quả có thể và sự kiện trong trò chơi, thí nghiệm',
 warm:`Tung một đồng xu: ra mặt sấp hay mặt ngửa? Ta biết có hai khả năng nhưng chưa biết có khả năng nào xảy ra.`,
 learn:`<p>Mỗi lần thử cho một trong các <b>kết quả có thể</b>. <b>Sự kiện</b> là một số kết quả (ví dụ mặt chẵn khi gieo xúc xắc). Kết quả <b>thuận lợi</b> cho sự kiện là kết quả làm sự kiện xảy ra. Sự kiện có thể chắc chắn, không thể, hoặc có thể xảy ra.</p><div class="warn">Lỗi thường gặp: “đều là lớn hơn k” mà vẫn tính cả k.</div>`,
 ex:[{q:'Gieo xúc xắc. Có mấy kết quả thuận lợi cho “mặt chẵn”?',s:['Các mặt chẵn: 2, 4, 6.','Có 3 kết quả.']}],
 sum:['Kết quả có thể: mỗi khả năng của phép thử.','Sự kiện: một số kết quả.','Chắc chắn, không thể, có thể.']},
{id:'xs-thucnghiem',gen:'p43',strand:'Thống kê và Xác suất',topic:'Xác suất',title:'Xác suất thực nghiệm',
 warm:`Tung đồng xu 20 lần, ngửa 12 lần. 12 trên 20 cho ta một ước lượng khả năng ra ngửa.`,
 learn:`<p><b>Xác suất thực nghiệm</b> của một sự kiện = (số lần sự kiện xảy ra) : (tổng số lần thực hiện). Viết dưới dạng phân số hoặc phần trăm. Thử càng nhiều lần thì càng đáng tin.</p><div class="warn">Lỗi thường gặp: chia ngược, hoặc nhầm sự kiện đối.</div>`,
 ex:[{q:'Gieo xúc xắc 30 lần, mặt 6 xuất hiện 6 lần. Xác suất thực nghiệm?',s:['6 : 30 = 1/5.']}],
 sum:['XSTN = số lần xảy ra : tổng số lần.','Rút gọn hoặc đổi ra %.','Thử nhiều lần hơn thì tin cậy hơn.']}
];
/* ---------- khung chương trình theo sách Toán 6 (Kết nối tri thức) ---------- */
const dc=n=>{let c=0;for(let i=1;i<=n;i++)if(n%i===0)c++;return c};
Object.assign(GEN,{
z13:[
()=>{const a=rnd(2,20),x=rnd(0,1)?a:-a;return mk(`Tìm số đối của ${Z(x)}.`,I(-x),[`Số đối nằm đối xứng với số đã cho qua điểm 0 trên trục số.`,`Số đối của ${Z(x)} là ${Z(-x)}.`],[{v:I(x),msg:`Đó chính là số đã cho. Số đối phải có dấu ngược lại.`}],`Hai số đối nhau có tổng bằng 0.`)},

const dbar=(L,A,B)=>{const m=Math.max(...A,...B),sc=70/m,w=Math.min(16,70/L.length);return SV(`<rect x='40' y='2' width='10' height='10' fill='var(--acc)'/>${TX(72,11,'Lớp 6A')}<rect x='115' y='2' width='10' height='10' fill='var(--hl)' stroke='currentColor'/>${TX(147,11,'Lớp 6B')}`+L.map((l,i)=>{const x=28+i*(185/L.length),h1=A[i]*sc,h2=B[i]*sc;return `<rect x='${x}' y='${105-h1}' width='${w}' height='${h1}' fill='var(--acc)'/><rect x='${x+w}' y='${105-h2}' width='${w}' height='${h2}' fill='var(--hl)' stroke='currentColor'/>${TX(x+w/2,101-h1,A[i])}${TX(x+1.5*w,101-h2,B[i])}${TX(x+w,121,l)}`}).join('')+`<line x1='22' y1='105' x2='215' y2='105' stroke='currentColor'/>`,'biểu đồ cột kép')};

{c:"Chương I. Tập hợp các số tự nhiên",t:"Tập 1",b:[[1,"Tập hợp"],[2,"Cách ghi số tự nhiên"],[3,"Thứ tự trong tập hợp các số tự nhiên"],[4,"Phép cộng và phép trừ số tự nhiên"],[5,"Phép nhân và phép chia số tự nhiên"],[6,"Luỹ thừa với số mũ tự nhiên"],[7,"Thứ tự thực hiện các phép tính"]]},
{c:"Chương II. Tính chia hết trong tập hợp các số tự nhiên",t:"Tập 1",b:[[8,"Quan hệ chia hết và tính chất"],[9,"Dấu hiệu chia hết"],[10,"Số nguyên tố"],[11,"Ước chung. Ước chung lớn nhất"],[12,"Bội chung. Bội chung nhỏ nhất"]]},
{c:"Chương III. Số nguyên",t:"Tập 1",b:[[13,"Tập hợp các số nguyên"],["14a","Phép cộng và phép trừ số nguyên (phần cộng)"],[14,"Phép cộng và phép trừ số nguyên (phần trừ)"],[15,"Quy tắc dấu ngoặc"],[16,"Phép nhân số nguyên"],[17,"Phép chia hết. Ước và bội của một số nguyên"]]},
{c:"Chương IV. Một số hình phẳng trong thực tiễn",t:"Tập 1",b:[[18,"Hình tam giác đều. Hình vuông. Hình lục giác đều"],[19,"Hình chữ nhật. Hình thoi. Hình bình hành. Hình thang cân"],[20,"Chu vi và diện tích của một số tứ giác đã học (hình chữ nhật, hình vuông)"],["20a","Chu vi và diện tích của một số tứ giác đã học (hình thoi, hình bình hành, hình thang cân)"]]},
{c:"Chương V. Tính đối xứng của hình phẳng trong tự nhiên",t:"Tập 1",b:[[21,"Hình có trục đối xứng"],[22,"Hình có tâm đối xứng"]]},
{c:"Chương VI. Phân số",t:"Tập 2",b:[[23,"Mở rộng khái niệm phân số. Phân số bằng nhau"],[24,"So sánh phân số. Hỗn số dương"],[25,"Phép cộng và phép trừ phân số"],[26,"Phép nhân và phép chia phân số"],[27,"Hai bài toán về phân số"]]},
{c:"Chương VII. Số thập phân",t:"Tập 2",b:[[28,"Số thập phân"],[29,"Tính toán với số thập phân"],[30,"Làm tròn và ước lượng"],[31,"Một số bài toán về tỉ số và tỉ số phần trăm"]]},
{c:"Chương VIII. Những hình học cơ bản",t:"Tập 2",b:[[32,"Điểm và đường thẳng"],[33,"Điểm nằm giữa hai điểm. Tia"],[34,"Đoạn thẳng. Độ dài đoạn thẳng"],[35,"Trung điểm của đoạn thẳng"],[36,"Góc"],[37,"Số đo góc"]]},
{c:"Chương IX. Dữ liệu và xác suất thực nghiệm",t:"Tập 2",b:[[38,"Dữ liệu và thu thập dữ liệu"],[39,"Bảng thống kê và biểu đồ tranh"],[40,"Biểu đồ cột"],[41,"Biểu đồ cột kép"],[42,"Kết quả có thể và sự kiện trong trò chơi, thí nghiệm"],[43,"Xác suất thực nghiệm"]]}
];
/* ---------- giao diện ---------- */
const app=$("#app");
let view={name:"home"},P=null;
function go(v){view=v;render();window.scrollTo(0,0)}
function head(){return `<header><h1><span class="mark">Toán 6</span> tự học</h1><div class="row"><button class="btn ghost" onclick="go({name:'parent'})">Phụ huynh</button><button class="btn ghost" aria-label="Đổi chế độ sáng tối" onclick="toggleTheme()">Sáng/Tối</button></div></header>`}
function toggleTheme(){const r=document.documentElement,d=r.dataset.theme==="dark"||(r.dataset.theme!=="light"&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"}
function mastery(id){const p=prog(id);return p.done?Math.round(p.best*100):0}
function nextLesson(){let w=null;for(const l of LESSONS){const p=prog(l.id);if(!p.done)return{l,why:"Bài tiếp theo trong chương trình"};if(p.best<0.7&&(!w||p.best<prog(w.id).best))w=l}return w?{l:w,why:"Bài cần ôn lại để vững hơn"}:{l:LESSONS[0],why:"Ôn lại sau một thời gian để nhớ lâu"}}
function renderHome(){
 const done=LESSONS.filter(l=>prog(l.id).done).length,n=nextLesson(),pct=Math.round(done/LESSONS.length*100);
 app.innerHTML=head()+`<section class="card"><p class="tag">${n.why}</p><h2>${n.l.title}</h2><button class="btn" onclick="openLesson('${n.l.id}')">Học tiếp</button></section>
 <section class="card"><h2>Tiến độ của em</h2><div class="bar" aria-hidden="true"><i style="width:${pct}%"></i></div><p>Đã hoàn thành ${done}/${LESSONS.length} bài mẫu (${pct}%).</p><p class="tag">Đây là bản thử nghiệm với 3 bài mẫu. Tiến độ lưu trên thiết bị này.</p></section>
 <h2>Theo sách Toán 6 – Kết nối tri thức</h2>`+CURR.map(c=>`<details class="card"><summary><b>${c.c}</b> <span class="tag">${c.t}</span></summary>`+c.b.map(([n,t])=>{const id=MAP[n];return id?`<button class="lesson" onclick="openLesson('${id}')"><b>Bài ${n}. ${t}</b><div class="tag">${prog(id).done?"Mức hiểu bài: "+mastery(id)+"%":"Đã có bài mẫu"}</div></button>`:`<div class="tag" style="padding:6px 0">Bài ${n}. ${t} · sắp có</div>`}).join("")+`</details>`).join("");
}
function openLesson(id){const l=LESSONS.find(x=>x.id===id);go({name:"lesson",l,step:0})}
const STEPS=["Khởi động","Kiến thức","Ví dụ","Luyện tập","Củng cố"];
function stepsBar(i){return `<div class="steps">`+STEPS.map((s,k)=>`<span class="${k===i?"on":""}">${s}</span>`).join("")+`</div>`}
function renderLesson(){
 const{l,step}=view;let body="";
 if(step===0)body=`<h2>${l.title}</h2><p>${l.warm}</p>`;
 if(step===1)body=l.learn;
 if(step===2)body=l.ex.map(e=>`<div class="ex"><b>Đề bài:</b> ${e.q}<details><summary class="tag">Xem lời giải từng bước</summary><ol>${e.s.map(x=>`<li>${x}</li>`).join("")}</ol></details></div>`).join("")+`<p class="tag">Hãy tự thử làm trước khi mở lời giải.</p>`;
 if(step===3)return renderPractice();
 if(step===4)return renderWrap();
 app.innerHTML=head()+stepsBar(step)+`<div class="card">${body}</div><div class="row"><button class="btn ghost" onclick="go({name:'${step?"lesson":"home"}',l:view.l,step:${step-1}})">Quay lại</button><button class="btn" onclick="${step===2?"startPractice()":"go({name:'lesson',l:view.l,step:"+(step+1)+"})"}">${step===2?"Bắt đầu luyện tập":"Tiếp tục"}</button></div>`;
}
function startPractice(){const l=view.l;P={l,i:0,tries:0,res:[],qs:[0,1,2,3,3].map(k=>l.gen&&GEN[l.gen][k]()),done:false,extra:false};view={name:"lesson",l,step:3};render()}
function renderPractice(){if(P.qs[P.i].type)return renderT();
 const{l}=view,q=P.qs[P.i];
 app.innerHTML=head()+stepsBar(3)+`<div class="card"><p class="tag">Câu ${P.i+1}/5${P.extra?" · bài tương tự (không tính điểm)":""}</p><p style="font-size:1.15rem">${q.text}</p>
 <div class="row"><input class="ans" id="in" inputmode="text" autocomplete="off" aria-label="Đáp án" placeholder="${l.gen==="frac"?"vd: 5/6":"đáp án"}" ${P.done?"disabled":""}> <span>${q.unit}</span><button class="btn" id="chk" onclick="check()" ${P.done?"disabled":""}>Kiểm tra</button></div><div id="fb" aria-live="polite"></div></div>`;
 const i=$("#in");i.focus();i.addEventListener("keydown",e=>{if(e.key==="Enter")check()});
}
function parse(s){s=s.trim().replace(/[−–]/g,"-").replace(/\s+/g,"");const dm=s.match(/^(-?\d+)[.,](\d{1,4})$/);if(dm){const k=10**dm[2].length;return{n:(dm[1].startsWith('-')?-1:1)*(Math.abs(+dm[1])*k+ +dm[2]),d:k}}const m=s.match(/^(-?\d+)(?:\/(\d+))?$/);if(!m)return null;const d=m[2]?+m[2]:1;if(!d)return null;return{n:+m[1],d}}
function check(){if(P.qs[P.i].type)return checkT();
 const q=P.qs[P.i],raw=$("#in").value,v=parse(raw),fb=$("#fb"),id=view.l.id,p=prog(id);
 if(!v){fb.innerHTML=`<div class="fb info">Hãy nhập một số nguyên${view.l.gen==="frac"?" hoặc phân số dạng a/b":""}. Ví dụ: −7.</div>`;return}
 P.tries++;
 if(eq(v,q.ans)){
  const red=norm(v.n,v.d),note=(raw.includes('/')&&v.d!==1&&(red.n!==v.n||red.d!==v.d))?" Giá trị đúng, nhưng nên rút gọn thành "+Fo(red)+".":"";
  if(!P.extra)P.res[P.i]=P.tries===1?1:0.5;
  fb.innerHTML=`<div class="fb ok"><b>Chính xác!</b>${note}</div>`+nextBtn();P.done=true;$("#in").disabled=true;$("#chk").disabled=true;return}
 const m=q.mist.find(x=>eq(x.v,v));
 if(P.tries===1){const k=m?m.msg:"Chưa đúng. Hãy kiểm tra lại các bước tính.";
  p.mist[view.l.topic]=(p.mist[view.l.topic]||0)+1;save();
  fb.innerHTML=`<div class="fb no"><b>Chưa đúng.</b> ${k}<br><b>Gợi ý:</b> ${q.hint}</div><p class="tag">Em thử lại nhé.</p>`;$("#in").select();return}
 if(!P.extra)P.res[P.i]=0;
 fb.innerHTML=`<div class="fb no"><b>Đáp án đúng: ${q.dec?DS(q.ans):Fo(q.ans)} ${q.unit}</b><ol>${q.steps.map(x=>`<li>${x}</li>`).join("")}</ol></div><div class="row"><button class="btn ghost" onclick="similar()">Làm bài tương tự</button>${nextBtn(true)}</div>`;
 P.done=true;$("#in").disabled=true;$("#chk").disabled=true;
}
function nextBtn(inline){return `<button class="btn" onclick="nextQ()">${P.i===4&&!P.extra?"Xem kết quả":"Câu tiếp"}</button>`}
function similar(){const l=view.l,lvl=Math.min(P.i,3);P.qs[P.i]=GEN[l.gen][lvl]();P.tries=0;P.done=false;P.extra=true;renderPractice()}
function nextQ(){
 P.extra=false;
 if(P.i<4){P.i++;P.tries=0;P.done=false;renderPractice();return}
 const sc=P.res.reduce((a,b)=>a+(b||0),0)/5,p=prog(view.l.id);p.done=true;p.tries++;p.best=Math.max(p.best,sc);p.last=sc;save();
 go({name:"lesson",l:view.l,step:4,sc})}
function renderWrap(){
 const l=view.l,sc=view.sc!=null?view.sc:prog(l.id).last||0,pc=Math.round(sc*100);
 const adv=pc>=70?"Em đã nắm khá vững. Hãy sang bài tiếp theo hoặc quay lại ôn sau vài ngày.":"Em nên xem lại phần Ví dụ rồi làm lại luyện tập trước khi học bài mới.";
 app.innerHTML=head()+stepsBar(4)+`<div class="card"><h2>Ghi nhớ</h2><ul>${l.sum.map(x=>`<li>${x}</li>`).join("")}</ul></div><div class="card"><h2>Mức hiểu bài: ${pc}%</h2><div class="bar"><i style="width:${pc}%"></i></div><p>${adv}</p><p class="tag">Đúng ngay lần đầu tính 1 điểm, đúng sau khi thử lại tính nửa điểm. Một lần đúng chưa chắc là đã thành thạo.</p></div><div class="row"><button class="btn ghost" onclick="openLesson('${l.id}')">Học lại bài này</button><button class="btn" onclick="go({name:'home'})">Về trang chủ</button></div>`;
}
function renderParent(){
 const rows=LESSONS.map(l=>{const p=prog(l.id),m=Object.entries(p.mist).map(([k,v])=>v+" lỗi").join(", ")||"–";return `<tr><td>${l.title}</td><td>${p.done?mastery(l.id)+"%":"Chưa học"}</td><td>${p.tries}</td><td>${m}</td></tr>`}).join("");
 app.innerHTML=head()+`<div class="card"><h2>Góc phụ huynh</h2><div class="wrap"><table><tr><th>Bài</th><th>Mức hiểu (tốt nhất)</th><th>Lượt làm</th><th>Câu sai lần đầu</th></tr>${rows}</table></div><p class="tag">Bản thử nghiệm: dữ liệu chỉ lưu trên thiết bị đang dùng, chưa có đăng nhập hay mật khẩu phụ huynh.</p><button class="btn ghost" onclick="if(confirm('Xóa toàn bộ tiến độ trên thiết bị này?')){mem={lessons:{}};save();go({name:'home'})}">Xóa tiến độ</button></div><button class="btn" onclick="go({name:'home'})">Về trang chủ</button>`;
}
function render(){({home:renderHome,lesson:renderLesson,parent:renderParent})[view.name]()}
load();render();
</script>
